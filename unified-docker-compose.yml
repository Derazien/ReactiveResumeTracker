version: '3.8'

services:
  # ReactiveResume PostgreSQL Database
  postgres-main:
    image: postgres:15  # Match server version exactly
    container_name: reactive-resume-postgres
    environment:
      POSTGRES_DB: reactive_resume
      POSTGRES_USER: reactive_resume
      POSTGRES_PASSWORD: reactive_resume_2024  # Standardized password (same as server)
      POSTGRES_INITDB_ARGS: "--auth-host=md5"  # Ensure md5 password auth
    ports:
      - "5432:5432"  # Server: 5432 (standard PostgreSQL port)
    volumes:
      - postgres_main_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reactive_resume -d reactive_resume"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Redis Cache for ReactiveResume
  redis:
    image: redis:7-alpine
    container_name: reactive-resume-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  # MinIO Object Storage
  minio:
    image: minio/minio:latest
    container_name: reactive-resume-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Chrome for PDF Generation
  chrome:
    image: browserless/chrome:latest
    container_name: reactive-resume-chrome
    environment:
      TOKEN: chrome-token-12345
      CONCURRENT: 10
      ENABLE_DEBUGGER: false
    ports:
      - "3001:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/json/version"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================
  # Ollama Local LLM (Optional - Can use cloud LLMs instead)
  # ============================================
  # NOTE: Skyvern automation is now a SEPARATE external service
  # Run Skyvern independently from its own directory (not in this compose file)
  # Configure via: SKYVERN_ENABLED=true, SKYVERN_BASE_URL=http://localhost:8000
  # See: docs/00-foundation/Project-Overview.md#skyvern-integration-external-service
  # ============================================
  
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

volumes:
  postgres_main_data:
  redis_data:
  minio_data:
  ollama_data:

networks:
  default:
    name: reactive_resume_network
